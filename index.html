<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hourly to Salary Calculator — Wage Converter | Tabutility</title>
  <meta name="description" content="Convert hourly wage to annual salary, or annual salary to hourly rate. Adjust for hours per week and weeks per year." />
  <meta name="keywords" content="hourly to salary calculator, wage converter, hourly rate to annual salary, salary to hourly, pay calculator" />
  <link rel="canonical" href="https://hourly-to-salary.tabutility.com/" />
  <meta property="og:title" content="Hourly to Salary Calculator" />
  <meta property="og:description" content="Convert between hourly wage and annual salary instantly." />
  <meta property="og:type" content="website" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⏱️</text></svg>" />
  <meta name="robots" content="index, follow" />
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7039091592734005" crossorigin="anonymous"></script>
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-78VZWJ5B1W"></script>
  <script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-78VZWJ5B1W');</script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body style="margin:0;background:#f8faff;font-family:'Segoe UI',Arial,sans-serif">
<div id="root"></div>
<script type="text/babel">
//<![CDATA[
const { useState } = React;
function fmt(n,d=2){return '$'+Number(n).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});}

function App() {
  const [mode, setMode] = useState('hourly');
  const [hourly, setHourly] = useState(25);
  const [annual, setAnnual] = useState(52000);
  const [hoursPerWeek, setHoursPerWeek] = useState(40);
  const [weeksPerYear, setWeeksPerYear] = useState(52);

  const totalHours = Number(hoursPerWeek) * Number(weeksPerYear);

  const fromHourly = Number(hourly) * totalHours;
  const fromAnnual = Number(annual) / (totalHours || 1);

  const displayAnnual = mode === 'hourly' ? fromHourly : Number(annual);
  const displayHourly = mode === 'annual' ? fromAnnual : Number(hourly);

  const rows = [
    ['Annual Salary', fmt(displayAnnual, 0)],
    ['Monthly', fmt(displayAnnual / 12, 0)],
    ['Biweekly (every 2 weeks)', fmt(displayAnnual / 26, 0)],
    ['Weekly', fmt(displayAnnual / Number(weeksPerYear), 0)],
    ['Daily (based on hrs/week)', fmt(displayHourly * Number(hoursPerWeek) / 5, 2)],
    ['Hourly Rate', fmt(displayHourly, 2)],
    ['Total Hours / Year', `${totalHours.toLocaleString()} hrs`],
  ];

  return (
    <div style={{maxWidth:520,margin:'0 auto',paddingBottom:40}}>
      <div style={{background:'#1a1a2e',padding:'12px 20px',display:'flex',alignItems:'center',justifyContent:'space-between'}}>
        <a href="https://tabutility.com" style={{color:'#a5b4fc',textDecoration:'none',fontSize:14}}>← All Tools</a>
        <span style={{color:'#fff',fontWeight:700,fontSize:15}}>⚡ Tabutility</span>
      </div>
      <div style={{background:'linear-gradient(135deg,#0f766e,#0d9488)',padding:'28px 20px',textAlign:'center',color:'#fff'}}>
        <div style={{fontSize:36,marginBottom:8}}>⏱️</div>
        <h1 style={{margin:'0 0 6px',fontSize:22,fontWeight:900}}>Hourly ↔ Salary Calculator</h1>
        <p style={{margin:0,fontSize:13,opacity:0.85}}>Convert between hourly wage and annual salary</p>
      </div>
      <div style={{padding:20}}>
        <div style={{display:'flex',gap:8,marginBottom:16}}>
          {[['hourly','Enter Hourly Rate'],['annual','Enter Annual Salary']].map(([m,l])=>(
            <button key={m} onClick={()=>setMode(m)} style={{flex:1,padding:'10px',borderRadius:10,border:`2px solid ${mode===m?'#0f766e':'#e5e7eb'}`,background:mode===m?'#0f766e':'#fff',color:mode===m?'#fff':'#374151',fontWeight:600,cursor:'pointer',fontSize:13}}>{l}</button>
          ))}
        </div>
        <div style={{background:'#fff',borderRadius:14,padding:20,boxShadow:'0 2px 12px rgba(0,0,0,0.06)',marginBottom:16}}>
          {mode === 'hourly' ? (
            <div style={{marginBottom:14}}>
              <label style={{fontSize:13,fontWeight:600,color:'#374151',display:'block',marginBottom:6}}>Hourly Rate</label>
              <div style={{position:'relative'}}>
                <span style={{position:'absolute',left:12,top:'50%',transform:'translateY(-50%)',color:'#6b7280'}}>$</span>
                <input type="number" value={hourly} onChange={e=>setHourly(e.target.value)}
                  style={{width:'100%',padding:'11px 12px 11px 28px',borderRadius:10,border:'2px solid #e5e7eb',fontSize:16,boxSizing:'border-box'}} />
              </div>
            </div>
          ) : (
            <div style={{marginBottom:14}}>
              <label style={{fontSize:13,fontWeight:600,color:'#374151',display:'block',marginBottom:6}}>Annual Salary</label>
              <div style={{position:'relative'}}>
                <span style={{position:'absolute',left:12,top:'50%',transform:'translateY(-50%)',color:'#6b7280'}}>$</span>
                <input type="number" value={annual} onChange={e=>setAnnual(e.target.value)}
                  style={{width:'100%',padding:'11px 12px 11px 28px',borderRadius:10,border:'2px solid #e5e7eb',fontSize:16,boxSizing:'border-box'}} />
              </div>
            </div>
          )}
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>
            <div>
              <label style={{fontSize:13,fontWeight:600,color:'#374151',display:'block',marginBottom:6}}>Hours per Week</label>
              <input type="number" value={hoursPerWeek} onChange={e=>setHoursPerWeek(e.target.value)}
                style={{width:'100%',padding:'10px 12px',borderRadius:10,border:'2px solid #e5e7eb',fontSize:15,boxSizing:'border-box'}} />
            </div>
            <div>
              <label style={{fontSize:13,fontWeight:600,color:'#374151',display:'block',marginBottom:6}}>Weeks per Year</label>
              <input type="number" value={weeksPerYear} onChange={e=>setWeeksPerYear(e.target.value)}
                style={{width:'100%',padding:'10px 12px',borderRadius:10,border:'2px solid #e5e7eb',fontSize:15,boxSizing:'border-box'}} />
            </div>
          </div>
        </div>
        <div style={{background:'#f0fdfa',borderRadius:14,padding:20,textAlign:'center',marginBottom:16}}>
          <div style={{fontSize:13,fontWeight:700,color:'#134e4a',marginBottom:4}}>ANNUAL SALARY</div>
          <div style={{fontSize:44,fontWeight:900,color:'#0f766e'}}>{fmt(displayAnnual,0)}</div>
          <div style={{fontSize:14,color:'#0d9488',marginTop:4}}>{fmt(displayHourly,2)} / hour · {hoursPerWeek} hrs/week</div>
        </div>
        <div style={{background:'#fff',borderRadius:14,padding:20,boxShadow:'0 2px 12px rgba(0,0,0,0.06)'}}>
          {rows.map(([l,v])=>(
            <div key={l} style={{display:'flex',justifyContent:'space-between',padding:'9px 0',borderBottom:'1px solid #f0f0f0',fontSize:14}}>
              <span style={{color:'#6b7280'}}>{l}</span><strong>{v}</strong>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
//]]>
</script>
</body>
</html>
